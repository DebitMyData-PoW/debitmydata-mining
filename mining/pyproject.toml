[project]
name = "dmd-mining"
version = "1.0.1"
description = "DMD Mining (mining.debitmydata.io): every pool mining DMD, the DebitMyData coin, from their APIs and the chain, with notifications and the site's files."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dmd-mining = "dmdmining.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
